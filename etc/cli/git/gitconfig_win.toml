# Opciones generales
[core]
	autocrlf = true
	pager = delta
	editor = vim


#
[init]
	defaultBranch = main


# Configuraciones basica del comando 'delta'
[delta]
	line-numbers = true
    light = false
	syntax-theme = Coldark-Dark


#
[interactive]
    diffFilter = delta --color-only


#
[diff]
    colorMoved = default


#
[merge]
    conflictstyle = diff3


# Incluir configuraciones personalizadas (modificables por el usuario final)
[include]
    path = ~/.config/git/user_main.toml
