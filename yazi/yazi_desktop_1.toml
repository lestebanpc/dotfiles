# Default values: 'https://github.com/sxyazi/yazi/blob/shipped/yazi-config/preset/yazi-default.toml'
# Path:
#   ~/.config/yazi/yazi.toml        (Unix-like systems)
#   %AppData%\yazi\config\yazi.toml (Windows)
#
# A TOML linter such as https://taplo.tamasfe.dev/ can use this schema to validate your config.
#:schema https://yazi-rs.github.io/schemas/yazi.json

[opener]

# > Por el 'opener' selecionado (por el usuario o el por defecto), el comando del SO definido en 'run' se caracteriza por:
#   > Lo items a procesar son los 'selected items'. Si no se tiene items selecionado, se usara 'hovered items'.
#   > Si se tiene 'selected items' y en el comando se usa las variables especiales del shell:
#     > Yazi < 25.5.12, la sintaxis era similar al usuado para parametros de una funcion o un script del shell.
#       > '$@' (o '%*' en Windows), el comando en 'run' solo se ejecutara 1 vez el comando.
#       > '$1' (o '%1' en Windows), el comando en 'run' se ejecutara tantas veces el comando cuando 'selected items' exista.
#     > Yazi >= 25.5.12, se unifica un unico expresion unica independiente del shell a usar.
#       > '%s'
#       > '%s1'
#   > Para evitar que un opener se ejecute multiples veces cuando se tiene selecionado diferentes items, siempre se usara '%s'
#     aun cuando no se use requiera (si se usa '%s1' o no se especifica, se ejecutara tantos item selecionados).
#     > Para emitir 1 solo evento DDS usando 'ya', por cada opener, usaremos '%s'.
#     > Para que el comando siempre se emita un solo 'opener' selecionado, independiente de los 'selected items' existentes.
#     > El controlador del plugin que procesa este evento, internamente tiene la logica para obtener los 'selected item' y
#       los 'hovered items'.
#  > Usaremos la notacion 'currect' para indicar que se usara los archivos selecionados y si no existe ningun selecionado, se
#    se usara los archivos 'hovered'.

open_nontext_file_1 = [
    # Para Windows
	{ run = 'start %s1', desc = "Open by defualt", for = "windows", orphan = true },

    # Para Android (Termux)
	{ run = 'termux-open %s1', desc = "Open by default", for = "android", orphan = true  },

    # Para MacOS
	{ run = 'open %s1', desc = "Open by default", for = "macos", orphan = true  },

    # Para Linux y Unix
	{ run = 'xdg-open %s1', desc = "Open by default", for = "linux", orphan = true },
    #{ run = 'echo "FILE=%s1" >> /tmp/yazi-open.log; xdg-open "%s1" >> /tmp/yazi-open.out 2>> /tmp/yazi-open.err', desc = "Debug open", for = "linux" },
]


edit_text_file_1 = [
    # Para Windows
	{ run = '%EDITOR% %s', desc = "Edit current in Yazi", for = "windows", block = true },
	{ run = 'ya pub go-fs --list "editfiles" "rootwd" "vim"  "both" %s'   , desc = "Edit current in VIM (New TermTab, Root WD)", for = "windows" },
	{ run = 'ya pub go-fs --list "editfiles" "rootwd" "nvim" "both" %s'   , desc = "Edit current in NVIM (New TermTab, Root WD)", for = "windows" },
	{ run = 'ya pub go-fs --list "editfiles" "rootwd" "vim" "hovered" %s' , desc = "Edit hovered in VIM (New TermTab, Root WD)", for = "windows" },
	{ run = 'ya pub go-fs --list "editfiles" "rootwd" "nvim" "hovered" %s', desc = "Edit hovered in NVIM (New TermTab, Root WD)", for = "windows" },

    # Para Android (Termux)
    # Para MacOS

    # Para Linux y Unix
	{ run = '${EDITOR:-vim} %s', desc = "Edit current in Yazi", for = "unix", block = true },
	{ run = 'ya pub go-fs --list "editfiles" "rootwd" "vim"  "both" %s'   , desc = "Edit current in VIM (New TermTab, Root WD)", for = "linux" },
	{ run = 'ya pub go-fs --list "editfiles" "rootwd" "nvim" "both" %s'   , desc = "Edit current in NVIM (New TermTab, Root WD)", for = "linux" },
	{ run = 'ya pub go-fs --list "editfiles" "rootwd" "vim"  "hovered" %s', desc = "Edit hovered in VIM (New TermTab, Root WD)", for = "linux" },
	{ run = 'ya pub go-fs --list "editfiles" "rootwd" "nvim" "hovered" %s', desc = "Edit hovered in NVIM (New TermTab, Root WD)", for = "linux" },
]

